{% extends "base.html" %}
{% block title %}{{ 'Editar' if material else 'Nueva' }} materia prima{% endblock %}
{% block content %}
  <h1>{{ 'Editar' if material else 'Nueva' }} materia prima</h1>
  <div class="card">
    <form method="post" class="formgrid">
      <div><label>Nombre</label><input name="nombre" required value="{{ material.nombre if material else '' }}"></div>
      <div><label>Unidad de medida</label><input name="unidad_medida" value="{{ material.unidad_medida if material else 'kg' }}"></div>
      <div><label>Stock de seguridad</label><input type="number" step="0.01" name="stock_seguridad" value="{{ material.stock_seguridad if material else 0 }}"></div>
      <div><label>Consumo diario estimado</label><input type="number" step="0.01" name="consumo_diario_estimado" value="{{ material.consumo_diario_estimado if material else 0 }}"></div>
      <div><label>Días de reposición (proveedor)</label><input type="number" name="dias_reposicion" value="{{ material.dias_reposicion if material else 3 }}"></div>
      <div><label>Compra mínima</label><input type="number" step="0.01" name="compra_minima" value="{{ material.compra_minima if material else 0 }}"></div>
      <div><label>Costo unitario</label><input type="number" step="0.01" name="costo_unitario" value="{{ material.costo_unitario if material else 0 }}"></div>
      <div><label>Vida útil (días)</label><input type="number" name="vida_util_dias" value="{{ material.vida_util_dias if material else '' }}"></div>
      <div><label>Proveedor</label><input name="proveedor" value="{{ material.proveedor if material else '' }}"></div>
      {% if not material %}
      <div><label>Stock inicial</label><input type="number" step="0.01" name="stock_inicial" value="0"></div>
      {% else %}
      <div><label>Activo</label>
        <select name="activo"><option value="1" {% if material.activo %}selected{% endif %}>Sí</option><option value="" {% if not material.activo %}selected{% endif %}>No</option></select>
      </div>
      {% endif %}
      <div class="full"><button class="btn" type="submit">Guardar</button></div>
    </form>
  </div>
{% endblock %}
