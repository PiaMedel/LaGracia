{% extends "base.html" %}
{% block title %}Registrar pre-preparación{% endblock %}
{% block content %}
  <h1>Registrar pre-preparación realizada</h1>
  <p class="subtitle">Al guardar, se descuentan automáticamente las materias primas de la receta y se suma el stock de la preparación (congelada).</p>
  <div class="card">
    <form method="post" class="formgrid">
      <div>
        <label>Preparación</label>
        <select name="preparation_id" required>
          {% for p in preparaciones %}
          <option value="{{ p.id }}">{{ p.nombre }}{% if sugerencias.get(p.id) %} (sugerido: {{ sugerencias[p.id]|int }}){% endif %}</option>
          {% endfor %}
        </select>
      </div>
      <div><label>Cantidad realizada</label><input type="number" step="0.01" name="cantidad_real" required></div>
      <div class="full"><button class="btn" type="submit">Guardar</button></div>
    </form>
  </div>
{% endblock %}
