{% extends "base.html" %}
{% block title %}{{ 'Editar' if producto else 'Nuevo' }} producto{% endblock %}
{% block content %}
  <h1>{{ 'Editar' if producto else 'Nuevo' }} producto</h1>
  <div class="card">
    <form method="post" class="formgrid">
      <div><label>Nombre</label><input name="nombre" required value="{{ producto.nombre if producto else '' }}"></div>
      <div><label>Categoría</label><input name="categoria" value="{{ producto.categoria if producto else '' }}"></div>
      <div><label>Unidad de venta</label><input name="unidad_venta" value="{{ producto.unidad_venta if producto else 'unidad' }}"></div>
      <div><label>Precio de venta</label><input type="number" step="0.01" name="precio_venta" value="{{ producto.precio_venta if producto else 0 }}"></div>
      <div>
        <label>Estado</label>
        <select name="estado">
          {% for e in estados %}
          <option value="{{ e }}" {% if producto and producto.estado==e %}selected{% endif %}>{{ e }}</option>
          {% endfor %}
        </select>
      </div>
      <div><label>Stock de seguridad</label><input type="number" step="0.01" name="stock_seguridad" value="{{ producto.stock_seguridad if producto else 0 }}"></div>
      <div><label>Vida útil (días)</label><input type="number" name="vida_util_dias" value="{{ producto.vida_util_dias if producto else '' }}"></div>
      {% if not producto %}
      <div><label>Stock inicial</label><input type="number" step="0.01" name="stock_inicial" value="0"></div>
      {% else %}
      <div><label>Activo</label>
        <select name="activo"><option value="1" {% if producto.activo %}selected{% endif %}>Sí</option><option value="" {% if not producto.activo %}selected{% endif %}>No</option></select>
      </div>
      {% endif %}
      <div class="full"><button class="btn" type="submit">Guardar</button></div>
    </form>
  </div>
{% endblock %}
